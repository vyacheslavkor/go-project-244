version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofumpt
    - goimports
    - golines

  settings:
    gofumpt:
      extra-rules: true
    golines:
      max-len: 120
      tab-len: 4

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    - gosec
    - prealloc
    - perfsprint
    - copyloopvar
    - exhaustive

    - cyclop
    - gocritic
    - revive
    - nakedret
    - nolintlint
    - bodyclose
    - noctx
    - misspell
    - funlen
    - lll
    - dupl
    - whitespace

  settings:
    cyclop:
      max-complexity: 10
      package-average: 0.0

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam
    revive:
      confidence: 0.8
    errcheck:
      check-type-assertions: true
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true
    funlen:
      lines: 100
      statements: 50
    lll:
      line-length: 120
      tab-width: 4
    exhaustive:
      default-signifies-exhaustive: true
      default-case-required: true

  exclusions:
    rules:
      - linters:
          - errcheck
          - gosec
        source: ShowAppHelp
      - linters:
          - funlen
        path: _test\.go